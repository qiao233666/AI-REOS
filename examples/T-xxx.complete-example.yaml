# Task Spec：由 aiops/specs/TEMPLATE.task.yaml 复制生成。
# 字段名与枚举值一律英文；说明文字用中文。
# 详细规范见 aiops/protocols/task-spec.md，结构约束见 aiops/schemas/task.schema.json。
schema_version: 1
id: T-017
title: "补齐 AI-REOS 的强制层：schema 可执行化 + 统一校验入口 + pre-commit 门禁"
status: complete
priority: high
owner: root-agent
objective:
  primary: "让 aiops/schemas/*.json 从文档变成可执行校验、提供统一校验入口 run_all_checks，并装上会阻止非法提交的 pre-commit 门禁。"
  why: "此前 schema 不可执行（校验脚本手写字段名，schema 改动不会影响校验）、无统一入口（需手动逐个跑 3 个脚本）、无任何 hook/CI（AI-REOS 的'强制约束'层完全缺失，规则只停留在概率性提示）。"
inputs:
  files:
    - aiops/checks/verify_ai_state.py
    - aiops/checks/verify_experiment_metadata.py
    - aiops/checks/verify_claims.py
    - aiops/schemas/evidence.schema.json
    - aiops/schemas/task.schema.json
    - aiops/schemas/experiment.schema.json
  evidence:
    - E-006
    - E-007
    - E-008
  external_sources: []
scope:
  include:
    - "新增 schema 校验库（纯标准库的 JSON Schema draft-07 子集）"
    - "三个既有校验脚本改为按 schema 文件驱动，不再硬编码字段名"
    - "新增 claim.schema.json（此前缺失）"
    - "新增 verify_task_specs.py（Task Spec 校验 + convergence/plan 一致性）"
    - "新增 check_adapter_drift.py（T-006：薄包装与 AGENTS.md 区块漂移检查）"
    - "新增 run_all_checks.py 统一入口"
    - "新增版本化 pre-commit hook 与 install_hooks.py，并安装到 .git/hooks"
  exclude:
    - "接 CI（仓库无 .github/，不伪造）"
    - "pip 安装 jsonschema（依项目规则'禁止擅自安装依赖'，改用纯标准库实现）"
- "改动生产代码（本仓源码目录）"
constraints:
  - "只依赖 PyYAML 与标准库；不得要求安装新依赖。"
  - "校验脚本不得使用命令行参数解析。"
  - "hook 必须可跳过（git commit --no-verify），且在找不到 python 时不阻止提交。"
  - "schema 中若出现校验库不支持的关键字，必须显式报错，不得静默跳过。"
assumptions:
  - "A-008：本机无 jsonschema，故以标准库实现等价子集校验器。"
  - "A-009：Trae 的 .trae/skills/ 下除 6 个 aiops 薄包装外，其余技能与本真源无关，不应参与漂移检查。"
risk:
  level: medium
  approval_required_for:
    - "安装 git hook（改变提交行为）"
plan:
  required: false
  file: null
  trigger_reason: null
acceptance:
  - "4 个 schema 文件均被校验脚本读取使用，脚本中不再硬编码字段/枚举清单"
  - "run_all_checks.py 一次运行全部 5 项检查并输出汇总"
  - "负向测试证明检查有牙齿：非法 enum、未定义字段、convergence 不一致、registry 不一致、fact 无证据均导致非 0"
  - "pre-commit 在存在非法 spec 时阻止提交（hook exit=1）"
  - "全部检查通过时 hook exit=0，不影响正常提交"
verification:
  commands:
    - "python aiops/checks/run_all_checks.py"
    - "git hook run pre-commit"
    - "python -m unittest tests.test_refactor"
  invariants:
    - "使用真实 schema 文件校验，字段清单不在脚本中重复"
    - "校验脚本遇不支持关键字时返回非 0"
output:
  files:
    - aiops/checks/schema_validation.py
    - aiops/checks/run_all_checks.py
    - aiops/checks/verify_task_specs.py
    - aiops/checks/check_adapter_drift.py
    - aiops/checks/install_hooks.py
    - aiops/checks/hooks/pre-commit
    - aiops/schemas/claim.schema.json
  response_schema: "aiops/templates/agent-result.yaml"
budget:
  max_subagents: 0
  max_output_tokens: 1000
  max_tool_calls: null
  max_wall_time_minutes: 60
  max_cpu_hours: 0.2
  max_gpu_hours: null
  escalation_conditions: []
convergence:
  required: false
  trigger_reason: null
  result: pending
  gaps: []
provenance:
  created_by: "root-agent"
  created_at: "2026-09-28"
